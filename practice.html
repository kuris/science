<body>
<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo"><span class="logo-char">🔬</span><span>과학아 놀자!</span></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기"><i class="fa-solid fa-bars"></i></button>
    <nav class="main-nav" id="main-nav"></nav>
    <div class="auth-box"></div>
  </div>
</header>
<main class="section" style="padding-top:28px;">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">PRACTICE</span>
      <h2>✏️ 문제 풀기</h2>
      <p>조건을 고르고 바로 풀어보세요. 해설과 오답노트가 함께 저장돼요.</p>
    </div>
    <div class="quiz-card" id="practice-setup">
      <div class="filter-bar">
        <select id="pr-school"><option value="all">전체 학교급</option><option value="elementary">🌱 초등</option><option value="middle">🌿 중등</option><option value="high">🌳 고등</option></select>
        <select id="pr-grade"><option value="all">전체 학년/과목</option></select>
        <select id="pr-field"><option value="all">전체 분야</option><option value="physics">⚙️ 물리</option><option value="chemistry">🧪 화학</option><option value="biology">🌱 생명과학</option><option value="earth_science">🌍 지구과학</option><option value="integrated">🔬 통합과학</option><option value="experiment">👀 실험/관찰</option></select>
        <select id="pr-unit"><option value="all">전체 단원</option></select>
      </div>
      <div class="filter-bar">
        <select id="pr-concept" style="flex:1;min-width:200px;"><option value="all">전체 개념</option></select>
        <select id="pr-level"><option value="all">전체 난이도</option><option value="basic">기초</option><option value="easy">쉬움</option><option value="normal">보통</option><option value="hard">어려움</option><option value="advanced">심화</option></select>
        <select id="pr-count"><option value="5">5문제</option><option value="10" selected>10문제</option><option value="20">20문제</option></select>
      </div>
      <div class="detail-controls"><button class="btn btn-primary" id="pr-start">문제 풀기 시작!</button></div>
    </div>
    <div class="practice-card" id="practice-play" style="display:none;">
      <div class="progress-dots" id="pr-progress"></div>
      <p id="pr-question" style="font-size:1.1rem;line-height:1.8;"></p>
      <div id="pr-answers"></div>
      <div class="feedback" id="pr-feedback" style="display:none;"></div>
    </div>
    <div class="practice-card" id="practice-result" style="display:none;"></div>
  </div>
</main>
<footer class="site-footer">
  <div class="container foot-grid">
    <div><h4>🔬 과학아 놀자!</h4><p>개념부터 실험까지, 초중고 과학을 쉽고 재미있게</p></div>

    <div><h4>안내</h4><p>틀린 문제는 오답노트에 자동 저장돼요.</p></div>
  </div>
  <div class="container foot-bottom">© 2026 과학아 놀자! · science.chatgpts.kr</div>
</footer>
