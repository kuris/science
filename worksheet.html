    <div class="auth-box"></div>
  </div>

<main class="section" style="padding-top:28px;">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">WORKSHEET</span>
      <h2>📄 학습지 만들기</h2>
      <p>조건을 고르면 A4 인쇄용 문제지가 만들어져요. 브라우저 인쇄로 PDF 저장도 돼요.</p>
    </div>
    <div class="quiz-card no-print">
      <div class="filter-bar">
        <select id="ws-school"><option value="all">전체 학교급</option><option value="elementary">🌱 초등</option><option value="middle">🌿 중등</option><option value="high">🌳 고등</option></select>
        <select id="ws-field"><option value="all">전체 분야</option><option value="physics">⚙️ 물리</option><option value="chemistry">🧪 화학</option><option value="biology">🌱 생명과학</option><option value="earth_science">🌍 지구과학</option><option value="integrated">🔬 통합과학</option></select>
        <select id="ws-unit"><option value="all">전체 단원</option></select>
        <select id="ws-level"><option value="all">전체 난이도</option><option value="easy">쉬움</option><option value="normal">보통</option><option value="hard">어려움</option></select>
      </div>
      <div class="filter-bar">
        <select id="ws-count"><option value="5">5문제</option><option value="10" selected>10문제</option><option value="20">20문제</option></select>
        <select id="ws-answer"><option value="no">정답지 숨기기</option><option value="yes">정답지 포함</option></select>
        <select id="ws-summary"><option value="yes">개념 요약 포함</option><option value="no">개념 요약 숨기기</option></select>
      </div>
      <div class="detail-controls"><button class="btn btn-primary" id="ws-make">학습지 만들기</button></div>
    </div>
    <div style="height:20px;"></div>
    <div id="sheet-output"></div>
  </div>
</main>
